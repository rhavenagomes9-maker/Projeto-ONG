<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Cadastro de voluntário</h1>
        <p>Preencha seus dados para fazer parte da nossa rede de voluntários.</p>

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">
            ☰
        </label>

        <nav>
            <a href="index.html">Início</a>

            <div class="dropdown">
                <a href="projetos.html">Projetos</a>

                <div class="dropdown-content">
                    <a href="projetos.html#doacoes">Doações</a>
                    <a href="projetos.html#voluntariado">Voluntariado</a>
                </div>
            </div>

            <a href="cadastro.html">Cadastro</a>
        </nav>

    </header>

    <main>

        <form>

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="cpf">CPF:</label>
                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}"
                    placeholder="000.000.000-00"
                    required
                >

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input
                    type="date"
                    id="nascimento"
                    name="nascimento"
                    required
                >

            </fieldset>

            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input
                    type="text"
                    id="cep"
                    name="cep"
                    pattern="[0-9]{5}-?[0-9]{3}"
                    placeholder="00000-000"
                    required
                >

                <br><br>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <br><br>

                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>
                <input
                    type="text"
                    id="estado"
                    name="estado"
                    maxlength="2"
                    required
                >

            </fieldset>

            <br>

            <fieldset>
                <legend>Contato</legend>

                <label for="telefone">Telefone:</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                    placeholder="(13) 99999-9999"
                    required
                >

            </fieldset>

            <br>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>ONG Esperança - Transformando vidas por meio da solidariedade.</p>
    </footer>

</body>

</html>
